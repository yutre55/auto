services:
  - type: web
    name: wordseek-auto-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python auto.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
